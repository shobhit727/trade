name: research-platform

on:
  push:
    branches:
      - feature/hybrid-evolution-research
    paths:
      - "research/platform/**"
      - "research/optimize/**"
      - "src/nsealgo/**"
      - "src/cryptobot/strategies/**"
      - "tests/unit/test_research_platform*.py"
      - "requirements/prod.txt"
      - "requirements/research.txt"
      - ".github/workflows/research-platform.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/platform/**"
      - "research/optimize/**"
      - "src/nsealgo/**"
      - "src/cryptobot/strategies/**"
      - "tests/unit/test_research_platform*.py"
      - "requirements/prod.txt"
      - "requirements/research.txt"
      - ".github/workflows/research-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-platform-tests:
    name: Research platform unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/prod.txt
            requirements/research.txt

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/prod.txt -r requirements/research.txt
          python -m pip install pytest pytest-timeout

      - name: Compile platform modules
        run: python -m compileall -q research/platform

      - name: Run the complete research-platform suite
        run: |
          python -m pytest \
            tests/unit/test_research_platform*.py \
            -q \
            --tb=short \
            --maxfail=1
