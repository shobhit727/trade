name: release-multiarch

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push multi-arch images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate tag and extract version
        id: meta
        run: |
          if [[ ! "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Error: This workflow only runs on version tags (refs/tags/v*)."
            echo "Current ref: ${GITHUB_REF}"
            exit 1
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      - name: Build, push and attest
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.VERSION }}
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.VERSION }}-multiarch
          build-args: |
            REQUIREMENTS=requirements/prod.txt
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true
          push: true
      - name: Scan image with Trivy (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.VERSION }}-multiarch
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"