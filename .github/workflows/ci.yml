name: ci

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_TAG: "3.14-slim"
  CI_PYTHON: "3.13"
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  COVERAGE_THRESHOLD: "70"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'src/**'
              - 'tests/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pyproject.toml'
              - 'requirements/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'src/**'
              - 'tests/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'Dockerfile.*'
              - 'requirements/**'
              - 'pyproject.toml'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.CI_PYTHON }}"
          cache: "pip"
      - name: Install requirements-dev
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.1 pyflakes==3.4.0
      - name: Ruff
        run: ruff check src tests
      - name: Pyflakes
        run: pyflakes src tests

  security-review:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  security-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.CI_PYTHON }}"
          cache: "pip"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip && pip install pip-audit
      - name: Audit production + test dependencies
        run: pip-audit -r requirements/prod.txt -r requirements/test.txt

  cargo-lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-test:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  pyo3:
    name: PyO3 bindings build + import smoke test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.CI_PYTHON }}"
          cache: "pip"
      - name: Install maturin
        run: python -m pip install maturin==1.9.6
      - name: Build and import lib
        run: |
          maturin build --manifest-path crates/cryptobot-py/Cargo.toml --release --out /tmp/wheels
          pip install --force-reinstall /tmp/wheels/*.whl
          python -c "import cryptobot_rs; print('cryptobot_rs import OK:', cryptobot_rs.__name__)"

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [lint, cargo-lint, cargo-test]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: "pip"
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install -e .
      - name: Run tests with coverage gate
        run: |
          pytest -q --tb=short \
            --cov=cryptobot --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            --timeout=60
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml
          retention-days: 14
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: py${{ matrix.python }}
          fail_ci_if_error: false

  docker-test:
    name: Docker test image
    runs-on: ubuntu-latest
    needs: [lint, unit, changes]
    if: needs.changes.outputs.docker == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build test target (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          build-args: |
            PYTHON_TAG=${{ env.PYTHON_TAG }}
            REQUIREMENTS=requirements/test.txt
          tags: cryptobot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Run pytest inside test container
        run: docker run --rm cryptobot:test
      - name: Scan test image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cryptobot:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  compose-validate:
    name: Docker Compose config
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate default profile
        run: docker compose config --quiet
      - name: Validate test profile
        run: docker compose --profile test config --quiet

  docker-build:
    name: Docker buildx (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [lint, unit, docker-test, changes]
    if: needs.changes.outputs.docker == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"linux/amd64","tag_platform":"linux-amd64"}]' || '[{"platform":"linux/amd64","tag_platform":"linux-amd64"},{"platform":"linux/arm64","tag_platform":"linux-arm64"}]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform == 'linux/arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.tag_platform }}
            ${{ env.REGISTRY_IMAGE }}:latest-${{ matrix.tag_platform }}
          build-args: |
            PYTHON_TAG=${{ env.PYTHON_TAG }}
            REQUIREMENTS=requirements/prod.txt
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ github.event_name == 'push' }}
          load: true
      - name: Smoke-run production container (amd64 only)
        if: matrix.platform == 'linux/amd64'
        run: |
          # The audit's blind spot: production target was built+scanned but never RUN.
          # This proves the shipped CMD actually serves /health (#22 regression guard).
          IMAGE="${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-linux-amd64"
          docker run -d --name prod-smoke -p 8080:8080 \
            -e BINANCE_TESTNET=true -e APP_ENV=production "$IMAGE"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json 2>/dev/null; then
              ok=yes; break
            fi
            sleep 1
          done
          docker logs prod-smoke 2>&1 | tail -20 || true
          docker rm -f prod-smoke > /dev/null || true
          if [ -z "$ok" ]; then
            echo "::error::production container never served /health"
            exit 1
          fi
          echo "smoke OK:"; cat /tmp/health.json
      - name: Scan image with Trivy (CRITICAL/HIGH)
        if: always() && github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.tag_platform }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  docker-manifest:
    name: Docker manifest (create multi-arch manifest)
    runs-on: ubuntu-latest
    needs: [docker-build, changes]
    if: needs.changes.outputs.docker == 'true' && github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-linux-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-linux-arm64