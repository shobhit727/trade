name: ci

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_TAG: "3.14-slim"
  CI_PYTHON: "3.13"
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.CI_PYTHON }}"
          cache: "pip"
      - name: Install requirements-dev
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 pyflakes==3.3.1
      - name: Ruff
        run: ruff check src tests
      - name: Pyflakes
        run: pyflakes src tests

  cargo-lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --workspace

  unit:
    name: Unit tests (Python 3.13)
    runs-on: ubuntu-latest
    needs: [lint, cargo-lint, cargo-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.CI_PYTHON }}"
          cache: "pip"
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt
          pip install numpy pandas
          pip install -e .
      - name: Run tests
        run: pytest -q --tb=short --cov=cryptobot --cov-report=term-missing --timeout=60

  docker-test:
    name: Docker test image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build test target
        run: |
          docker build \
            --target test \
            --build-arg REQUIREMENTS=requirements/test.txt \
            -t cryptobot:test .
      - name: Run pytest inside test container
        run: docker run --rm cryptobot:test

  docker-build:
    name: Docker buildx (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: [lint, unit, docker-test]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag_platform: linux-amd64
          - platform: linux/arm64
            tag_platform: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.tag_platform }}
            ${{ env.REGISTRY_IMAGE }}:latest-${{ matrix.tag_platform }}
          build-args: |
            REQUIREMENTS=requirements/prod.txt
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ github.event_name == 'push' }}
      - name: Manifest list (merge)
        if: github.event_name == 'push' && matrix.platform == 'linux/amd64'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-linux-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-linux-arm64

  compose-validate:
    name: Docker Compose config
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Validate default profile
        run: docker compose config --quiet
      - name: Validate test profile
        run: docker compose --profile test config --quiet
