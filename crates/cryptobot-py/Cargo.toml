[package]
name = "cryptobot-py"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[dependencies]
cryptobot-core = { path = "../cryptobot-core", features = ["python"] }
cryptobot-backtest = { path = "../cryptobot-backtest" }
cryptobot-features = { path = "../cryptobot-features" }
cryptobot-risk = { path = "../cryptobot-risk" }
cryptobot-stats = { path = "../cryptobot-stats" }
cryptobot-orderbook = { path = "../cryptobot-orderbook" }
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38", "generate-abi3"] }

[lib]
name = "cryptobot_py"
crate-type = ["cdylib"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[features]
default = []