[package]
name = "cryptobot-py"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[dependencies]
cryptobot-core = { path = "../cryptobot-core", features = ["python"] }
cryptobot-backtest = { path = "../cryptobot-backtest", features = ["python"] }
cryptobot-features = { path = "../cryptobot-features", features = ["python"] }
cryptobot-risk = { path = "../cryptobot-risk", features = ["python"] }
cryptobot-stats = { path = "../cryptobot-stats", features = ["python"] }
cryptobot-orderbook = { path = "../cryptobot-orderbook", features = ["python"] }
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38", "generate-abi3"] }
maturin = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[features]
default = ["maturin"]
maturin = ["maturin"]