[package]
name = "cryptobot-py"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[dependencies]
cryptobot-core = { path = "../cryptobot-core" }
cryptobot-features = { path = "../cryptobot-features", features = ["python"] }
cryptobot-risk = { path = "../cryptobot-risk", features = ["python"] }
cryptobot-stats = { path = "../cryptobot-stats" }
cryptobot-orderbook = { path = "../cryptobot-orderbook", features = ["python"] }
cryptobot-backtest = { path = "../cryptobot-backtest", features = ["python"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38", "generate-abi3"] }
rust_decimal = { version = "1.34", features = ["serde"] }
rust_decimal_macros = "1.34"

[lib]
name = "cryptobot_py"
crate-type = ["cdylib"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[features]
default = ["python"]
python = []