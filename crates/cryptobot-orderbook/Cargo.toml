[package]
name = "cryptobot-orderbook"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[dependencies]
cryptobot-core = { path = "../cryptobot-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
bincode = { workspace = true }
rmp-serde = { workspace = true }
tracing = { workspace = true }
nalgebra = { workspace = true }
rust_decimal = { version = "1.34", features = ["serde"] }
rust_decimal_macros = "1.34"
uuid = { version = "1.6", features = ["v4", "serde", "fast-rng"] }
rand = { workspace = true }
rand_distr = { workspace = true }
statrs = { workspace = true }
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[features]
default = []
python = ["pyo3"]