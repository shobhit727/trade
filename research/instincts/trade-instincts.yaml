id: benchmark-against-doing-nothing
trigger: A strategy is being evaluated for whether it is worth running
action: Benchmark it against the do-nothing alternative with an identical cost stack, because beating a scrambled null is necessary but not sufficient
confidence: 0.9
scope: project
domain: quant-research
---
A signal-scrambled null answers "does the ranking carry information?". It does not
answer "would I have been better off just holding?". Both are required.

Phase 7 built an equal-weight universe benchmark with identical treatment (PIT
membership, 32.32 bp round trip, FIFO lots, STCG/LTCG, annual rebalance) and
found the book beat it in 8/13 folds on CAGR, 8/13 on Sharpe, 8/13 on MaxDD --
a coin flip, p=0.240. Without that comparison, "no edge vs a scrambled null"
would have been reported as mild alpha.

A cost-free benchmark flatters the strategy and is worthless. The decision
metric is risk-adjusted: Sharpe of book minus Sharpe of benchmark, and MaxDD of
book minus MaxDD of benchmark.

