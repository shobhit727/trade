id: mask-selection-not-prices
trigger: A point-in-time membership or universe file is used to restrict a backtest
action: Lag membership to the prior period's publication, mask selection rather than prices, and carry last-known price for held names
confidence: 0.9
scope: project
domain: quant-research
---
Two separate bugs, both fixed the same way.

Look-ahead: the first implementation used the CURRENT month's month-end membership
for every date in that month, letting a name enter up to a month early. The
membership in force during month M is the one published at the end of M-1.

NaN poisoning: NaN-ing non-members out of the PRICE panel produced 206 NaN equity
bars and a nonsense -100% MaxDD, because a name dropped from the index on 1 June
is still held by an annual-rebalance book until January.

```python
# Membership gates SELECTION only. Prices are always observed.
live = px.notna() & (px > 0) & tradable.reindex(index=px.index, columns=px.columns)
p = last_px.get(sym)   # carried, never fabricated
```

