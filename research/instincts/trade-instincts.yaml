id: detector-before-deletion
trigger: A detector inspects adjacency between rows such as gaps, runs, or jumps, while other cleaning rules also remove rows
action: Run the detector before any row deletion and document the ordering constraint, because otherwise it fires on gaps created by those deletions
confidence: 0.9
scope: project
domain: quant-research
---
Rule C10 keys off the overnight gap to find unadjusted corporate actions. Written
after C5 (extreme-move removal) and C9 (frozen-run removal), it fired on gaps
those rules had CREATED by deleting rows: nestleind 2010-01-11 was 3.8% raw but a
30%+ gap once the adjacent freeze was dropped, and bajajfinsv was 7.0% and 0.0%
raw. A deletion is not a corporate action.

```python
# ORDER IS LOAD-BEARING: C10 runs BEFORE C5 and C9, on the raw series.
df = _apply_c10(df, symbol, rep)   # <- before any row deletion
```

