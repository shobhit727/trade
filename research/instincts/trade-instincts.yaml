id: sanity-check-grouping-before-printing
trigger: Producing grouped or aggregated output for analysis
action: Assert the group count and inspect the first few groups before printing, because a bad grouping key floods the context
confidence: 0.75
scope: project
domain: python
---
A drawdown-episode analysis used a cumsum that incremented per bar, producing 762
one-bar "episodes" and flooding the output with hundreds of lines. The useful
number was in the same script: Indian largecaps sit below -10% for 28% of the
time and worst drawdown is -67.9%.

Print `nunique()` of the group key, and the first few groups, before the full
listing.

---
id: deliver-the-thing-not-the-research-program
trigger: A long research programme has falsified its own hypothesis and the remaining work is deployment rather than discovery
action: Check the measured result against the hard-coded risk limits early, and pivot to shipping rather than adding more search
confidence: 0.85
scope: project
domain: quant-research
---
By the 2026-10-19 session, four independent tests had agreed that price-only
technical signals on Indian largecaps are not a source of return after costs:
scrambled null p=0.386, walk-forward 6/13, PIT universe edge collapses to +0.41
pp, and holding the universe 8/13 on every metric. The measurable deliverable
was a mostly-invested, low-turnover largecap book returning ~17%/yr net, whose
signal contributes nothing.

The binding constraint turned out to be the mandate, not the strategy. Checking
`risk/limits.py` against the measured MaxDD at the START would have saved two
phases. When the constitution and the asset class are incompatible, that is a
human decision to be surfaced with numbers, not a problem to engineer around.

Also: report the honest characterisation. The return comes from being invested
cheaply. That is capital efficiency, not alpha, and must never be relabelled as
alpha in a later report.
