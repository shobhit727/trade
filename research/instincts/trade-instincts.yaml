id: exposure-is-the-first-order-driver
trigger: A long-only equity book's measured median return is near zero or negative
action: Bucket every result by exposure before optimising anything, because the high-exposure bucket is typically the only profitable one and turnover cuts are usually the wrong lever
confidence: 0.85
scope: project
domain: quant-research
---
Phase 1, 9024 runs, bucketed every result by exposure:

    <30%    n=1612  median CAGR  0.000   30.6% positive
    30-40%  n= 624  median CAGR -0.029   32.7% positive
    40-50%  n=1001  median CAGR -0.046   24.1% positive
    50-60%  n= 732  median CAGR -0.016   39.1% positive
    >60%    n= 543  median CAGR +0.019   58.0% positive

The >60% bucket was the only one with a positive median. A book in cash 55% of
the time cannot earn an absolute return however cheap the trading is, and
cutting turnover 55x (daily to annual) bought only about 0.8%/yr.

Measure exposure before optimising anything else.

---
id: mandate-conflict-is-a-human-decision
trigger: A measured strategy's drawdown exceeds a hard-coded risk limit that the code cannot widen
action: Stop and report it as a mandate conflict for a human decision, quantify whether any exposure level satisfies the limit, and never quietly widen the limit
confidence: 0.9
scope: project
domain: quant-research
---
`nsealgo/risk/limits.py` hard-codes `max_drawdown_halt = -15%` and
`max_drawdown_absolute = -25%`, re-asserted at import by `verify_limits()`.
The money-making book has MaxDD -33.8%. The equal-weight universe spends 28% of
its time below -10% and has a -67.9% worst drawdown.

Simulating the switch: flattening at -15% and re-entering at -10% gives up 7.4
pp/yr and STILL leaves a -34.4% drawdown, because a -15% trigger on a -68% asset
re-enters into a continuing decline. There is no exposure level that satisfies
-15% while holding this asset, even 25% exposure breaches it in 2008.

The -15% halt was written for a single-stock 5-60 day book where a 15% drawdown
means something is broken. Inherited unchanged into a diversified always-invested
book, obeying it destroys 60% of the return.

Report the conflict with numbers; do not engineer around a deliberate
constitutional guard.

