---
id: shared-constant-unit-mismatch
trigger: A constant appears in both a production module and a research harness, and one side documents a different unit than the other consumes
action: Import and derive the constant from the canonical source instead of restating it, and add a test asserting the two harnesses agree
confidence: 0.95
scope: project
domain: python
---
In the 2026-10-19 nsealgo session, `research/optimize/config.py` held
`STATUTORY_BPS = 11.92` documented as bps-of-turnover (matching
`nsealgo.costs.CostModel.round_trip_bps`, which divides by 2x notional), but
`FeeSchedule._fee` charged it as bps-of-notional. Every cost in the project was
understated 1.469x (21.92 -> 32.32 bp) and nothing detected it for the life of
the programme.

Derive instead of restating:

```python
def _delivery_statutory_bps() -> D:
    from nsealgo.costs import CostModel
    model = CostModel(segment="delivery", slippage_bps=D("0"))
    return model.round_trip_bps(CAPITAL_INR) * 2   # turnover-bps -> notional-bps
```

The import is what disambiguates the unit. A restated number carries its unit
only in a comment, and comments drift silently.

