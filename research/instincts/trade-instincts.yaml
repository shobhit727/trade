id: repair-only-what-is-provable
trigger: A data-cleaning rule could delete rows, and ambiguity is possible such as crash versus corporate action versus demerger
action: Repair only what is provable, record everything else as flagged-but-unmodified, and test explicitly that a real drawdown survives the rule
confidence: 0.9
scope: project
domain: quant-research
---
The first version of loader rule C10 truncated the series at any ambiguous
corporate action. Measurement killed it: truncation would have deleted the real
2008 crash in bajajfinsv and duplicated C9's nestleind freeze fix. Under-cleaning
is visible and recoverable; over-cleaning is silent and flatters MaxDD, which is
the exact failure GOAL.md section 6 forbids.

The shipped rule only rescales a provable 1:x ratio and records everything else:

```python
nearest = min(C10_SPLIT_RATIOS, key=lambda r: abs(r - ratio))
if abs(nearest - ratio) <= C10_RESCALE_TOLERANCE * nearest:
    df.loc[df.index < event, ["open", "high", "low", "close"]] *= nearest
    rep.rescaled_actions.append((symbol, str(event.date()), float(nearest)))
else:
    rep.unresolved_actions.append((symbol, str(event.date()), float(ratio), spread))
```

Ask "what real history could this rule destroy?" and write a test for exactly that.

