id: reproduce-in-isolation-before-attributing
trigger: Tests fail after a change and it is unclear whether the change caused it
action: Reproduce the failures in isolation and compare against stashed HEAD, because ordering-dependent pollution in a full-suite run is common and pre-existing
confidence: 0.8
scope: project
domain: testing
---
Three crypto tests failed in a full-suite run. They passed in isolation, and they
failed DIFFERENTLY against stashed HEAD. The 791 unrelated in-flight crypto
changes in the working tree made attribution non-obvious, and the instinct to
assume "my change caused this" would have sent the investigation in the wrong
direction.

Also: when a large unrelated working tree exists, stage only the specific files
for a commit. Never reset or bulk-stage the user's in-flight work.

