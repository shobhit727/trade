id: units-typo-in-the-verification-script
trigger: Writing a verification script to independently confirm a hand-computed value
action: Use unmistakable decimal literals such as 0.001 for 0.1 percent, and print the derived total before comparing
confidence: 0.8
scope: project
domain: python
---
The whole point of a verification script is independence. In the 2026-10-19
session the check written to confirm the cost model produced a 101x error
because it wrote `stt = 0.100 + 0.100` meaning "0.1% + 0.1%", which is actually
10% + 10%. The script contradicted the code correctly, and the contradiction was
in the script.

Print the derived total in the same units you intend to compare before drawing
any conclusion from a mismatch.

