id: measure-the-risk-control-before-trusting-it
trigger: A risk control such as a regime filter, stop, or overlay is proposed to improve a strategy
action: Simulate the control end to end and measure it, because a filter that engages early and stays engaged can make results worse while appearing to help
confidence: 0.8
scope: project
domain: quant-research
---
The market-level regime filter looked obviously right: cut exposure when the
market is in a downtrend. Simulated, it went flat in January 2008, six months
before the crash, and sat in cash for 626 days of a losing market. It also
changed the result not at all.

A risk control is an empirical claim about a mechanism, not a design intuition.
Simulate it on the actual data, and check WHEN it engages and for HOW LONG, not
just whether it fires at all.

