id: incomplete-correction-is-a-floor
trigger: A survivorship or coverage correction is applied but the corrected data is incomplete
action: State the coverage fraction next to the correction and label the result a floor or ceiling rather than an estimate
confidence: 0.85
scope: project
domain: quant-research
---
Only 68.8% of point-in-time NIFTY-50 members have price history in the panel
(23/50 in 2009 rising to 47/50 in 2026). The unpriceable names are
disproportionately the collapsed and delisted ones, so the corrected universe is
biased optimistically and the measured 8.9 pp/yr is a FLOOR on the true bias, not
an estimate of it.

Same discipline applies to the membership file itself, whose rows for
2025-09 through 2026-08 come from a single unverified reconstruction and are
forward-filled, and which is unverified before 2017-10.

