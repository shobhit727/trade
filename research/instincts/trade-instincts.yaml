id: charge-selection-to-the-hypothesis
trigger: A signal or strategy result looks strong on a holdout window
action: Before quoting it, compute the family distribution across all tested cells and run walk-forward with params selected once; a p-value after post-hoc selection is not a p-value
confidence: 0.95
scope: project
domain: quant-research
---
Phase 2 of the 2026-10-19 session found the trend family beating its scrambled
null in 43 of 44 configs, binomial p=2.6e-12. It was selection: 44 configs on
one 2.75-year window, and the 95th percentile of the 96-cell family was 60.1%
while the median was 36.2%. Walk-forward over 13 annual folds gave 6/13,
p=0.778.

Always report the family before the winner:

```python
cells = df.groupby(["strategy", "rebalance"]).agg(pos=("cagr", lambda s: (s > 0).mean()))
print(cells.pos.describe(percentiles=[.5, .95]))
print(f"cells at/above best: {(cells.pos >= best).sum()} of {len(cells)}")
```

And in walk-forward, select params once on the first fold and reuse them.
Re-picking per fold turns a walk-forward into N independent in-sample searches.

