apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptobot
  namespace: cryptobot
  labels:
    app.kubernetes.io/name: cryptobot
    app.kubernetes.io/component: bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cryptobot
      app.kubernetes.io/component: bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cryptobot
        app.kubernetes.io/component: bot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: cryptobot-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      containers:
        - name: cryptobot
          image: ghcr.io/shobhit727/trade:latest
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args: ["-m", "cryptobot.cli.main", "serve"]
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cryptobot-config
            - secretRef:
                name: cryptobot-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: metrics
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: false
            - name: config
              mountPath: /app/configs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cryptobot-data
        - name: config
          configMap:
            name: cryptobot-config
      terminationGracePeriodSeconds: 30
