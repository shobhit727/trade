apiVersion: v1
kind: Secret
metadata:
  name: cryptobot-secrets
  namespace: cryptobot
  labels:
    app.kubernetes.io/name: cryptobot
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Replace placeholders (e.g. via sealed-secrets / external-secrets / SOPS).
  # `kubectl create secret` from a literal works too:
  #   kubectl -n cryptobot create secret generic cryptobot-secrets \
  #     --from-literal=BINANCE_API_KEY=... \
  #     --from-literal=BINANCE_API_SECRET=... \
  #     --from-literal=DB_PASSWORD=...
  BINANCE_API_KEY: "REPLACE_ME"
  BINANCE_API_SECRET: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
