apiVersion: v1
kind: Service
metadata:
  name: cryptobot
  namespace: cryptobot
  labels:
    app.kubernetes.io/name: cryptobot
    app.kubernetes.io/component: bot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cryptobot
    app.kubernetes.io/component: bot
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
