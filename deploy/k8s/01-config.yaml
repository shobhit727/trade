apiVersion: v1
kind: ConfigMap
metadata:
  name: cryptobot-config
  namespace: cryptobot
  labels:
    app.kubernetes.io/name: cryptobot
    app.kubernetes.io/component: config
data:
  APP_ENV: "production"
  APP_LOG_LEVEL: "INFO"
  RISK_MAX_TOTAL_EXPOSURE_PCT: "0.80"
  RISK_MAX_SINGLE_POSITION_PCT: "0.20"
  RISK_MAX_DAILY_LOSS_PCT: "0.05"
  RISK_MAX_DRAWDOWN_PCT: "0.15"
  RISK_KILL_SWITCH_ENABLED: "true"
  RISK_KILL_SWITCH_DAILY_LOSS_PCT: "0.10"
  EXECUTION_MODE: "paper"
  EXECUTION_ORDER_TYPE: "limit"
  EXECUTION_LIMIT_OFFSET_BPS: "5"
  EXECUTION_MAX_SLIPPAGE_BPS: "20"
  BACKTEST_ENABLED: "true"
  MONITORING_PROMETHEUS_ENABLED: "true"
  MONITORING_PROMETHEUS_PORT: "9090"
  MONITORING_HEALTH_CHECK_INTERVAL: "30"
  DB_HOST: "timescaledb"
  DB_PORT: "5432"
  DB_NAME: "cryptobot"
  DB_USER: "cryptobot"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MARKET_DATA_REDIS_HOST: "redis"
  MARKET_DATA_REDIS_PORT: "6379"
  BINANCE_TESTNET: "true"
