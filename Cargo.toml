[workspace]
resolver = "2"
members = [
    "crates/cryptobot-core",
    "crates/cryptobot-backtest",
    "crates/cryptobot-features",
    "crates/cryptobot-risk",
    "crates/cryptobot-stats",
    "crates/cryptobot-orderbook",
    "crates/cryptobot-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["cryptobot team"]
rust-version = "1.75"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
dashmap = "6.1"

# Math & Stats
nalgebra = "0.32"
rand = "0.8"
rand_distr = "0.4"
statrs = "0.17"

# Time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# Async
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Data
arrow = { version = "52.0", features = ["prettyprint", "compute", "parquet"] }
parquet = { version = "52.0", features = ["arrow", "compression-zstd", "compression-snappy"] }
polars = { version = "0.37", features = ["lazy", "parquet", "chrono", "serde", "dtype-decimal", "dtype-categorical", "dtype-array"] }

# Python bindings
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38", "generate-abi3"] }
maturin = "1.6"

# Serialization
bincode = "1.3"
rmp-serde = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Config
config = "0.13"
toml = "0.8"

# Testing
criterion = "0.5"
proptest = "1.0"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
