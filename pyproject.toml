[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptobot"
version = "0.1.0"
description = "Elite Quantitative Trading System"
readme = "plan.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "numpy>=2.2",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "aiohttp>=3.11",
    "websockets>=14.0",
    "redis>=5.2",
    "ccxt>=4.4",
    "orjson>=3.10",
    "rich>=13.9",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0"]

[project.scripts]
cryptobot = "cryptobot.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
