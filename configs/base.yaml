version: "1.0"
app:
  name: "cryptobot"
  env: "development"  # development, testnet, production
  log_level: "INFO"
  timezone: "UTC"

# Exchange Configuration
exchanges:
  binance:
    enabled: true
    testnet: true
    api_key: "${BINANCE_API_KEY}"
    api_secret: "${BINANCE_API_SECRET}"
    base_url: "https://testnet.binance.vision"
    ws_url: "wss://testnet.binance.vision"
    rate_limit: 1200  # requests per minute
    symbols:
      - "BTCUSDT"
      - "ETHUSDT"
      - "BNBUSDT"
      - "SOLUSDT"
      - "XRPUSDT"
      - "ADAUSDT"
      - "DOGEUSDT"
      - "AVAXUSDT"
    default_symbol: "BTCUSDT"
    timeframes: ["1m", "5m", "15m", "1h", "4h"]
    max_positions: 5
    position_size_pct: 0.15  # 15% per position

# Market Data
market_data:
  buffer_size: 10000
  orderbook_depth: 20
  update_interval_ms: 100
  cache_ttl_seconds: 300
  redis:
    host: "redis"
    port: 6379
    db: 0
    max_connections: 50

# Strategy Configuration
strategies:
  enabled:
    - "mean_reversion"
    - "trend_following"
    - "funding_arbitrage"
    - "statistical_arbitrage"

  mean_reversion:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
    timeframe: "15m"
    lookback: 100
    z_score_threshold: 2.0
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    bb_period: 20
    bb_std: 2.0
    max_holding_hours: 24
    stop_loss_pct: 0.02
    take_profit_pct: 0.03

  trend_following:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT"]
    timeframe: "1h"
    fast_ema: 12
    slow_ema: 26
    signal_ema: 9
    adx_period: 14
    adx_threshold: 25
    atr_period: 14
    atr_multiplier: 2.0
    max_holding_hours: 168  # 1 week
    trailing_stop_pct: 0.015

  funding_arbitrage:
    enabled: true
    symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
    min_funding_rate: 0.0001  # 0.01% per 8h
    max_funding_rate: 0.001   # 0.1% per 8h
    hedge_leverage: 1
    rebalance_interval_hours: 8
    min_basis_pct: 0.0005

  statistical_arbitrage:
    enabled: true
    pairs:
      - ["BTCUSDT", "ETHUSDT"]
      - ["SOLUSDT", "AVAXUSDT"]
    lookback: 200
    z_entry: 2.0
    z_exit: 0.5
    z_stop: 3.5
    half_life_hours: 24
    max_holding_hours: 72

# Risk Management
risk:
  max_total_exposure_pct: 0.80      # 80% of capital deployed
  max_single_position_pct: 0.20     # 20% max per position
  max_daily_loss_pct: 0.05          # 5% daily loss limit
  max_drawdown_pct: 0.15            # 15% max drawdown
  max_correlation: 0.7              # Max pair correlation limit
  kill_switch_enabled: true
  kill_switch_daily_loss_pct: 0.10  # 10% = hard stop
  position_sizing: "kelly_fraction" # fixed, kelly_fraction, volatility_target
  kelly_fraction: 0.25              # 25% Kelly
  volatility_target: 0.15           # 15% annual vol target
  min_order_size_usd: 10
  max_order_size_usd: 10000
  max_leverage: 5.0                 # Max leverage per order
  max_open_positions: 10            # Max concurrent positions
  price_deviation_pct: 0.05         # Reject orders >5% from reference price
  max_orders_per_minute: 60         # Rate limit for submissions
  require_stop_loss_above_usd: 1000 # SL required for orders >$1000 notional
  drawdown_scale_start_pct: 0.05    # Begin scaling positions after 5% DD
  drawdown_scale_floor_pct: 0.25    # Floor: scale down to 25% of normal at max DD

# Execution
execution:
  mode: "paper"  # paper, testnet, live
  order_type: "limit"
  limit_offset_bps: 5  # 5 bps from mid
  ioc_timeout_ms: 5000
  max_slippage_bps: 20
  retry_attempts: 3
  retry_delay_ms: 100
  smart_routing: false

# ML Configuration
ml:
  enabled: true
  inference_mode: "local"  # local, api
  model_path: "/app/models"
  features:
    - "returns_1m"
    - "returns_5m"
    - "returns_15m"
    - "returns_1h"
    - "volatility_1h"
    - "volatility_4h"
    - "rsi_14"
    - "macd"
    - "bb_position"
    - "volume_ratio"
    - "funding_rate"
    - "basis"
    - "oi_change"
  models:
    direction:
      enabled: true
      type: "sklearn_logreg"
      threshold: 0.55
      retrain_hours: 168
    volatility:
      enabled: false
      type: "sklearn_logreg"
      horizon_hours: 4
    regime:
      enabled: false
      type: "hmm"
      n_states: 4
  min_samples_train: 10000
  feature_lookback: 500

# XMR (Monero) Configuration
xmr:
  enabled: true
  daemon:
    host: "host.docker.internal"  # or your node IP
    port: 18081
    ssl: false
    username: ""
    password: ""
  wallet_rpc:
    host: "host.docker.internal"
    port: 18083
    ssl: false
    username: ""
    password: ""
  funding:
    enabled: true
    min_balance_xmr: 0.1
    target_balance_xmr: 1.0
    withdraw_threshold_xmr: 5.0
    withdraw_address: "${XMR_WITHDRAW_ADDRESS}"
    confirmations: 10
  subaddress_lookahead: 100

# Monitoring
monitoring:
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"
  grafana:
    enabled: true
    port: 3000
  alerts:
    telegram_enabled: false
    telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
    telegram_chat_id: "${TELEGRAM_CHAT_ID}"
    discord_webhook: "${DISCORD_WEBHOOK}"
    email_enabled: false
    whatsapp_enabled: false
    whatsapp_token: "${WHATSAPP_TOKEN}"
    whatsapp_phone_id: "${WHATSAPP_PHONE_ID}"
    whatsapp_to: []
  health_check_interval: 30
  data_stale_threshold_seconds: 60
  data_degraded_threshold_seconds: 10

# Database
database:
  type: "timescaledb"
  host: "timescaledb"
  port: 5432
  name: "cryptobot"
  user: "cryptobot"
  password: "${DB_PASSWORD}"
  pool_size: 10
  max_overflow: 20

# Backtesting
backtest:
  enabled: true
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  initial_capital: 10000
  commission_bps: 5
  slippage_bps: 3
  funding_rate_included: true

# External Service URLs
external_services:
  kite_base_url: "https://api.kite.trade"
  kite_login_url: "https://kite.zerodha.com/connect/login"
  yahoo_finance_chart_url: "https://query1.finance.yahoo.com/v8/finance/chart/"
  binance_production_url: "https://api.binance.com"
  binance_futures_url: "https://fapi.binance.com"
  binance_spot_ws_url: "wss://stream.binance.com:9443/stream?streams="
  binance_futures_ws_url: "wss://fstream.binance.com/stream?streams="
  binance_data_ws_url: "wss://stream.binance.com:9443"
  telegram_api_url: "https://api.telegram.org"
  pagerduty_events_url: "https://events.pagerduty.com/v2/enqueue"
  whatsapp_api_url: "https://graph.facebook.com/v21.0/{phone_id}/messages"

# Timeout Configuration (seconds)
timeouts:
  http_default_timeout: 20
  http_long_timeout: 30
  http_short_timeout: 10
  strategy_feed_timeout: 0.5
  stop_wait_timeout: 30
  smtp_timeout: 30

# Server Bind Configuration
server:
  host: "127.0.0.1"
  port: 8080
  nse_basket_port: 8084
  nse_powerhour_port: 8085